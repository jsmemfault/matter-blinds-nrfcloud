#
# Production image. Same application and observability stack as prj.conf, with
# every development affordance removed.
#
# Note on provisioning: PROVISIONING stays enabled (the device still needs its
# on-die key and JWT signing) but PROVISIONING_SHELL is off, so a fielded unit
# cannot be asked to re-key over a console. Factory provisioning therefore runs
# against a separate build that keeps the shell — see
# plans/identity-provisioning.md.
#

# ---------------- Matter ----------------
CONFIG_CHIP=y
CONFIG_CHIP_PROJECT_CONFIG="src/chip_project_config.h"
CONFIG_CHIP_DEVICE_PRODUCT_NAME="Smart Shade"
CONFIG_NCS_SAMPLE_MATTER_ZAP_FILE_PATH="${APPLICATION_CONFIG_DIR}/src/default_zap/window-app.zap"
CONFIG_CHIP_DEVICE_PRODUCT_ID=32784
# Window Covering (0x0202). Without this the device type defaults to
# 0xFFFF, which is not a valid Matter device type and shows up wrong in
# Basic Information and the DNS-SD TXT records.
CONFIG_CHIP_DEVICE_TYPE=514
CONFIG_STD_CPP17=y
CONFIG_CHIP_ENABLE_PAIRING_AUTOSTART=y
CONFIG_CHIP_BLE_EXT_ADVERTISING=y
CONFIG_CHIP_BLE_ADVERTISING_DURATION=60
CONFIG_BT_DEVICE_NAME="SmartShade"
CONFIG_CHIP_FACTORY_DATA=y
CONFIG_CHIP_FACTORY_DATA_BUILD=y
CONFIG_CHIP_NFC_ONBOARDING_PAYLOAD=n

# ---------------- Thread: sleepy end device ----------------
CONFIG_OPENTHREAD_NORDIC_LIBRARY_MTD=y
CONFIG_OPENTHREAD_MTD=y
CONFIG_OPENTHREAD_FTD=n
CONFIG_CHIP_ENABLE_ICD_SUPPORT=y
CONFIG_CHIP_THREAD_SSED=y
CONFIG_CHIP_ICD_SLOW_POLL_INTERVAL=500
CONFIG_CHIP_ICD_FAST_POLLING_INTERVAL=500
CONFIG_OPENTHREAD_DNS_CLIENT=y

CONFIG_PWM=y
CONFIG_DK_LIBRARY=y
CONFIG_PM_DEVICE=y
CONFIG_RAM_POWER_DOWN_LIBRARY=y
CONFIG_IEEE802154_NRF5_RX_STACK_SIZE=1024
CONFIG_MPU_STACK_GUARD=y
CONFIG_RESET_ON_FATAL_ERROR=y
CONFIG_NCS_SAMPLE_MATTER_WATCHDOG=y

# ---------------- DTLS transport ----------------
CONFIG_MBEDTLS=y
CONFIG_MBEDTLS_TLS_LIBRARY=y
CONFIG_MBEDTLS_MD_C=y
CONFIG_MBEDTLS_SSL_PROTO_DTLS=y
CONFIG_MBEDTLS_KEY_EXCHANGE_ECDHE_ECDSA_ENABLED=y
# The nRF Cloud root CA in credentials.h is a PEM string. nrf_security leaves
# PEM_PARSE_C off under NCS 3.4.0, so mbedtls_x509_crt_parse() reads the PEM
# text as DER and fails with -0x2180 (X509_INVALID_FORMAT).
CONFIG_MBEDTLS_PEM_PARSE_C=y
CONFIG_MBEDTLS_SSL_DTLS_CONNECTION_ID=y
CONFIG_MBEDTLS_SSL_IN_CONTENT_LEN=1500
CONFIG_MBEDTLS_SSL_OUT_CONTENT_LEN=900
CONFIG_MBEDTLS_HEAP_SIZE=20480
CONFIG_BASE64=y

# ---------------- Identity ----------------
CONFIG_PROVISIONING=y
CONFIG_PROVISIONING_SHELL=n
CONFIG_PROVISIONING_FALLBACK_KEY=n
CONFIG_SETTINGS=y
CONFIG_TRUSTED_STORAGE=y

# ---------------- Observability ----------------
CONFIG_BLINDS_UDP_ECHO_SHELL=n
CONFIG_BLINDS_THREAD_AUTOJOIN=n

CONFIG_MEMFAULT=y
CONFIG_MEMFAULT_SHELL=n
CONFIG_MEMFAULT_METRICS=y
CONFIG_MEMFAULT_LOGGING_ENABLE=n
CONFIG_MEMFAULT_NCS_PROJECT_KEY="YOUR_MEMFAULT_PROJECT_KEY"
# Firmware version: generated, not hand-maintained.
#
# MEMFAULT_NCS_FW_VERSION_AUTO reports "<APP_VERSION_STRING>+<build id prefix>",
# e.g. "0.2.0+fd7322", taking the semantic part from the VERSION file and the
# suffix from the GNU build ID. Four builds in two days previously all reported
# "0.1.0", including firmware that crash-looped every heartbeat and firmware
# that did not, which makes any crash-free-hours comparison across that boundary
# meaningless. Bump VERSION for a release; the build ID distinguishes every
# build in between for free.
CONFIG_MEMFAULT_NCS_FW_VERSION_AUTO=y
# Device ID and hardware version are board-specific: see boards/<board>.conf.
CONFIG_MEMFAULT_NCS_FW_TYPE="blinds-matter-software"
CONFIG_MEMFAULT_METRICS_MEMORY_USAGE=n
CONFIG_MEMFAULT_METRICS_SYNC_SUCCESS=n
CONFIG_MEMFAULT_METRICS_CONNECTIVITY_CONNECTED_TIME=n
CONFIG_MEMFAULT_METRICS_BLUETOOTH=n
CONFIG_MEMFAULT_NCS_IMPLEMENT_METRICS_COLLECTION=n
CONFIG_MEMFAULT_RAM_BACKED_COREDUMP=y
CONFIG_MEMFAULT_RAM_BACKED_COREDUMP_SIZE=4096
# Heartbeat collection reaches into OpenThread and the CHIP stack. The stock
# Zephyr port runs the collect callback on the system workqueue (1120-byte
# stack here), which overflows and faults instead of emitting a heartbeat.
# telemetry.c supplies the timer instead and collects on its own 8 KB thread.
CONFIG_MEMFAULT_METRICS_TIMER_CUSTOM=y
CONFIG_MEMFAULT_METRICS_HEARTBEAT_INTERVAL_SECS=1800

# ---------------- Strip development affordances ----------------
CONFIG_CHIP_LIB_SHELL=n
CONFIG_NCS_SAMPLE_MATTER_TEST_SHELL=n
CONFIG_OPENTHREAD_SHELL=n
CONFIG_SHELL=n
CONFIG_CONSOLE=n
CONFIG_UART_CONSOLE=n
CONFIG_SERIAL=n
CONFIG_LOG=n
CONFIG_PRINTK=n
CONFIG_BOOT_BANNER=n
CONFIG_THREAD_NAME=n
CONFIG_ASSERT_VERBOSE=n
CONFIG_ASSERT_NO_FILE_INFO=y
CONFIG_USE_SEGGER_RTT=n

# LTO is deliberately OFF, unlike the NCS window_covering release config.
#
# The Memfault Zephyr port hooks fault handling through linker symbol
# interposition — -Wl,--wrap=z_arm_fault, --wrap=z_fatal_error, --wrap=main and
# others (ports/zephyr/common/CMakeLists.txt, ports/zephyr/panics/CMakeLists.txt).
# LTO internalises those symbols, so the linker can no longer interpose and the
# build dies with 'undefined reference to z_arm_fault' and
# 'undefined reference to __wrap_z_fatal_error'.
#
# Coredump capture is the whole point of the exercise, so LTO loses.
# CONFIG_LTO=y
CONFIG_ISR_TABLES_LOCAL_DECLARATION=y

# ---------------- nRF52840 external flash ----------------
CONFIG_NORDIC_QSPI_NOR=y
CONFIG_NORDIC_QSPI_NOR_FLASH_LAYOUT_PAGE_SIZE=4096
CONFIG_STREAM_FLASH=y
CONFIG_IMG_MANAGER=y
CONFIG_MCUBOOT_IMG_MANAGER=y
