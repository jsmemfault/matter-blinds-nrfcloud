#
# Console and shell over SEGGER RTT instead of the board UART.
#
# The nRF5340-DK's Interface MCU stopped passing VCOM traffic: the app core
# demonstrably transmits (UARTE0 EVENTS_TXSTARTED and EVENTS_ENDTX both set,
# PSEL.TXD = P0.20 as the devicetree specifies) but the host receives nothing
# on either virtual COM port. RTT rides the debug probe's memory access, which
# still works, so this gets a console back without waiting on a probe firmware
# repair.
#
# Layer it on:
#   west build -b nrf5340dk/nrf5340/cpuapp -- -DEXTRA_CONF_FILE=overlay-rtt.conf
#
CONFIG_USE_SEGGER_RTT=y
CONFIG_RTT_CONSOLE=y
CONFIG_UART_CONSOLE=n

# The standalone RTT log backend and the RTT shell backend both claim RTT
# channel 0, which is a build-time assertion failure. Let logs ride the shell's
# own log backend instead -- the same arrangement the UART console used.
CONFIG_LOG_BACKEND_RTT=n
CONFIG_LOG_BACKEND_UART=n
CONFIG_SHELL_LOG_BACKEND=y

CONFIG_SHELL_BACKEND_SERIAL=n
CONFIG_SHELL_BACKEND_RTT=y

# RTT defaults to SEGGER_RTT_MODE_NO_BLOCK_SKIP: when the up-buffer fills it
# discards output rather than waiting. That is invisible for logging but
# corrupts anything used as a data channel -- provision.py's attested CSR
# bundle (DAC, PAI, CSR and signature, several KB emitted in one burst) came
# back with whole blocks missing, which surfaces as the same misleading
# "device did not emit" error as a malformed argument.
#
# Blocking mode stalls the firmware whenever no host is draining RTT, so this
# belongs to a bench image only. Never ship it.
CONFIG_SEGGER_RTT_MODE_BLOCK_IF_FIFO_FULL=y
CONFIG_SEGGER_RTT_BUFFER_SIZE_UP=8192

# The host->target buffer defaults to 16 bytes, against a 512-byte shell command
# buffer. The RTT down-channel has no flow control back to the host, so a line
# written in one burst is simply truncated at 16 characters: "provision status"
# arrives as "provision sta". That surfaces as "Please specify a subcommand" or,
# worse, as a command that silently does something else. 'provision keygen' is
# exactly 16 characters, which is why it was the only step that ever worked.
# Match the shell buffer.
CONFIG_SEGGER_RTT_BUFFER_SIZE_DOWN=512
