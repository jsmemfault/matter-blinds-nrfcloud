#
# Quiet the device for tooling that drives the shell.
#
# provision.py reads a command's output until the link goes idle. The blinds
# simulation logs every cluster write continuously, so the link never goes
# idle, the 'OK' is buried in a flood of ZCL traffic and provisioning fails
# with a misleading "did not emit" error. Provisioning is a factory step and
# the simulation has no business running during it.
#
CONFIG_BLINDS_SIM=n

# Let the shell change log levels at runtime, so the next person has a way out
# without a rebuild.
CONFIG_LOG_CMDS=y
