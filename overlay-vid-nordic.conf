# Diagnostic overlay: advertise Nordic's real CSA vendor ID (0x1915 = 6421) in
# place of the Matter test VID 0xFFF1 (65521), to establish whether an ecosystem
# refuses this device before opening a BLE connection purely on a vendor-ID
# lookup.
#
# Nordic permits use of its VID without guarantees, which is why this uses
# 0x1915 rather than an unrelated certified vendor's ID.
#
# The SDK only ships development DACs for VID 0xFFF1, and a real vendor's DAC
# would have to chain to that vendor's PAA, so the attestation credentials are
# pinned explicitly to the FFF1-8010 development set rather than letting the
# factory data generator look up a (nonexistent) 1915-8010 pair.
#
# The result is deliberately inconsistent: the advertisement, QR payload and
# Basic Information cluster all report 0x1915 while the DAC still attests
# 0xFFF1, so device attestation WILL fail once a commissioner connects. That is
# expected and does not invalidate the test -- the signal is whether a CHIPoBLE
# connection is opened at all, not whether commissioning completes.
#
# Bench diagnostic only. Never ship this.
CONFIG_CHIP_DEVICE_VENDOR_ID=6421

CONFIG_CHIP_FACTORY_DATA_CERT_SOURCE_USER=y
CONFIG_CHIP_FACTORY_DATA_USER_CERTS_DAC_CERT="/opt/nordic/ncs/v3.4.0/modules/lib/matter/credentials/development/attestation/Matter-Development-DAC-FFF1-8010-Cert.der"
CONFIG_CHIP_FACTORY_DATA_USER_CERTS_DAC_KEY="/opt/nordic/ncs/v3.4.0/modules/lib/matter/credentials/development/attestation/Matter-Development-DAC-FFF1-8010-Key.der"
CONFIG_CHIP_FACTORY_DATA_USER_CERTS_PAI_CERT="/opt/nordic/ncs/v3.4.0/modules/lib/matter/credentials/development/attestation/Matter-Development-PAI-FFF1-noPID-Cert.der"
