#
# Smart window covering with Memfault observability over nRF Cloud CoAP.
# Target: nrf52840dk/nrf52840
#
# Base configuration follows the NCS matter/window_covering sample, including
# its MTD / SSED sleepy-device topology, because that is what a real motorised
# shade is. The observability stack is layered on top unchanged.
#

# ---------------- Matter ----------------
CONFIG_CHIP=y
CONFIG_CHIP_PROJECT_CONFIG="src/chip_project_config.h"
CONFIG_CHIP_DEVICE_PRODUCT_NAME="Smart Shade"
CONFIG_NCS_SAMPLE_MATTER_ZAP_FILE_PATH="${APPLICATION_CONFIG_DIR}/src/default_zap/window-app.zap"
CONFIG_CHIP_DEVICE_PRODUCT_ID=32784
CONFIG_STD_CPP17=y

# BLE commissioning — the path a real product uses
CONFIG_CHIP_ENABLE_PAIRING_AUTOSTART=y
CONFIG_CHIP_BLE_EXT_ADVERTISING=y
CONFIG_CHIP_BLE_ADVERTISING_DURATION=60
CONFIG_BT_DEVICE_NAME="SmartShade"

# Factory data. Required for provisioning: the DAC and PAI live here, and
# provisioning_attest.cpp needs them to vouch for the CSR.
CONFIG_CHIP_FACTORY_DATA=y
CONFIG_CHIP_FACTORY_DATA_BUILD=y

# ---------------- Thread: sleepy end device ----------------
# A shade is battery or mains-with-low-duty-cycle, not a router. MTD keeps both
# the OpenThread library and the RAM footprint smaller than FTD.
CONFIG_OPENTHREAD_NORDIC_LIBRARY_MTD=y
CONFIG_OPENTHREAD_MTD=y
CONFIG_OPENTHREAD_FTD=n
CONFIG_CHIP_ENABLE_ICD_SUPPORT=y
CONFIG_CHIP_THREAD_SSED=y
CONFIG_CHIP_ICD_SLOW_POLL_INTERVAL=500
CONFIG_CHIP_ICD_FAST_POLLING_INTERVAL=500

# DNS client, for resolving nRF Cloud and the SNTP server through the border
# router. Verified present in the nRF52840 MTD prebuilt library.
CONFIG_OPENTHREAD_DNS_CLIENT=y

CONFIG_PWM=y
CONFIG_DK_LIBRARY=y
CONFIG_PM_DEVICE=y
CONFIG_IEEE802154_NRF5_RX_STACK_SIZE=1024
CONFIG_THREAD_NAME=y
CONFIG_MPU_STACK_GUARD=y
CONFIG_RESET_ON_FATAL_ERROR=n

# ---------------- Shell (lab build) ----------------
CONFIG_CHIP_LIB_SHELL=y
CONFIG_NCS_SAMPLE_MATTER_TEST_SHELL=y
CONFIG_OPENTHREAD_SHELL=y
CONFIG_SHELL_STACK_SIZE=10240
CONFIG_SHELL_CMD_BUFF_SIZE=512
CONFIG_USE_SEGGER_RTT=n
CONFIG_CHIP_NFC_ONBOARDING_PAYLOAD=n

# ---------------- DTLS transport ----------------
# NOTE: the nRF54L project reached this config via CONFIG_OPENTHREAD_COAPS=y,
# which is NOT usable here — the nRF52840 MTD prebuilt library exports no
# otCoapSecure symbols. The mbedTLS DTLS client is therefore selected directly.
# We never use OpenThread's CoAP stack anyway; this only ever supplied the
# mbedTLS configuration.
CONFIG_MBEDTLS=y
# MBEDTLS_TLS_LIBRARY is NOT set here: NCS 3.4.0 made it promptless, so
# assigning it in prj.conf is a hard Kconfig error. It is forced on in
# Kconfig instead, which works on 3.2.x, 3.3.x and 3.4.x alike.
CONFIG_MBEDTLS_SSL_PROTO_DTLS=y
# MBEDTLS_SSL_TLS_C / SSL_CLI_C are forced on in Kconfig — see the comment
# there. No SSL_SRV_C or SSL_COOKIE_C: this is a client only.
CONFIG_MBEDTLS_MD_C=y
CONFIG_MBEDTLS_KEY_EXCHANGE_ECDHE_ECDSA_ENABLED=y
# The nRF Cloud root CA in credentials.h is a PEM string. nrf_security leaves
# PEM_PARSE_C off under NCS 3.4.0, so mbedtls_x509_crt_parse() reads the PEM
# text as DER and fails with -0x2180 (X509_INVALID_FORMAT).
CONFIG_MBEDTLS_PEM_PARSE_C=y

# DTLS Connection ID (RFC 9146) — required by nRF Cloud CoAP
CONFIG_MBEDTLS_SSL_DTLS_CONNECTION_ID=y

# Handshake buffers. The 900-byte default cannot hold nRF Cloud's server cert.
CONFIG_MBEDTLS_SSL_IN_CONTENT_LEN=1500
CONFIG_MBEDTLS_SSL_OUT_CONTENT_LEN=900
CONFIG_MBEDTLS_HEAP_SIZE=20480

CONFIG_BASE64=y

# ---------------- Device identity provisioning ----------------
CONFIG_PROVISIONING=y
CONFIG_PROVISIONING_SHELL=y
# Lab devices only. Production images must set this to n.
CONFIG_PROVISIONING_FALLBACK_KEY=n
# nRF54L only — the one symbol that changes on migration.
# CONFIG_PROVISIONING_KEY_IN_KMU=y

# Persistent PSA keys need an encrypted ITS backend. nRF52840 has no TF-M, so
# this is the trusted_storage library rather than a secure partition.
CONFIG_SETTINGS=y
CONFIG_TRUSTED_STORAGE=y

# ---------------- Observability ----------------
CONFIG_BLINDS_UDP_ECHO_SHELL=y
CONFIG_BLINDS_THREAD_AUTOJOIN=n

CONFIG_MEMFAULT=y
CONFIG_MEMFAULT_SHELL=y
CONFIG_MEMFAULT_METRICS=y
CONFIG_MEMFAULT_LOGGING_ENABLE=n
CONFIG_MEMFAULT_NCS_PROJECT_KEY="YOUR_MEMFAULT_PROJECT_KEY"
CONFIG_MEMFAULT_NCS_DEVICE_ID_STATIC=y
CONFIG_MEMFAULT_NCS_DEVICE_ID="blinds-nrf52840-01"
CONFIG_MEMFAULT_NCS_FW_VERSION_STATIC=y
CONFIG_MEMFAULT_NCS_FW_VERSION="0.1.0"
CONFIG_MEMFAULT_NCS_HW_VERSION="nrf52840-dk"
CONFIG_MEMFAULT_NCS_FW_TYPE="blinds-matter-software"
CONFIG_MEMFAULT_METRICS_MEMORY_USAGE=n
CONFIG_MEMFAULT_METRICS_SYNC_SUCCESS=n
CONFIG_MEMFAULT_METRICS_CONNECTIVITY_CONNECTED_TIME=n
CONFIG_MEMFAULT_METRICS_BLUETOOTH=n
CONFIG_MEMFAULT_NCS_IMPLEMENT_METRICS_COLLECTION=n

# Coredump lives in RAM. 4 KB rather than the nRF54L project's 8 KB — RAM is
# the scarce resource on a 256 KB part. Revisit once the real figure is known;
# a flash-backed coredump in the external QSPI is the alternative.
CONFIG_MEMFAULT_RAM_BACKED_COREDUMP=y
CONFIG_MEMFAULT_RAM_BACKED_COREDUMP_SIZE=4096

# Heartbeat every 30 min; a shade's state changes slowly and radio time is
# the dominant energy cost on a sleepy device.
CONFIG_MEMFAULT_METRICS_HEARTBEAT_INTERVAL_SECS=1800

# ---------------- Logging ----------------
CONFIG_LOG=y
CONFIG_LOG_MODE_DEFERRED=y
CONFIG_CHIP_APP_LOG_LEVEL=3
CONFIG_MATTER_LOG_LEVEL_INF=y

# ---------------- nRF52840 external flash ----------------
# The MCUboot secondary slot lives in the QSPI part, which is what frees the
# app slot to 959 KB. Also the natural home for a flash-backed coredump.
CONFIG_NORDIC_QSPI_NOR=y
CONFIG_NORDIC_QSPI_NOR_FLASH_LAYOUT_PAGE_SIZE=4096
CONFIG_STREAM_FLASH=y
CONFIG_IMG_MANAGER=y
CONFIG_MCUBOOT_IMG_MANAGER=y
