#
# nRF52840-DK: the pilot unit, onboarded to nRF Cloud as blinds-nrf52840-01.
#
# The device ID must match the deviceId bound to this board's public key by
# nrf_cloud_onboard, or POST /auth/jwt returns 4.01. The hardware version is
# what lets one software type serve both DKs in the Memfault UI.
#
CONFIG_MEMFAULT_NCS_DEVICE_ID_STATIC=y
CONFIG_MEMFAULT_NCS_DEVICE_ID="blinds-nrf52840-01"
CONFIG_MEMFAULT_NCS_HW_VERSION="nrf52840-dk"
