#
# nRF5340-DK: the next-model blinds unit.
#
# Separate device ID because nRF Cloud binds one device ID to one public key,
# and this board generates its own non-exportable key in its own PSA store.
# This ID must be onboarded (tools/provision.py) before it can authenticate.
#
# Same software type as the nRF52840 build, distinguished by hardware version:
# Memfault targets OTA releases by software type plus hardware version, so one
# type across both boards keeps fleet views unified and releases separable.
#
CONFIG_MEMFAULT_NCS_DEVICE_ID_STATIC=y
CONFIG_MEMFAULT_NCS_DEVICE_ID="blinds-nrf5340-01"
CONFIG_MEMFAULT_NCS_HW_VERSION="nrf5340-dk"
